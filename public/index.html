<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech TV Movies — Stream & Download Movies</title>
  
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f59e0b" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0b0e14; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card-dark { background-color: #121722; border: 1px solid rgba(255, 255, 255, 0.06); }
    .btn-amber { background-color: #f59e0b; color: #000000; font-weight: 800; }
    .btn-amber:hover { background-color: #d97706; }
    .pill-active { background-color: #f59e0b; color: #000000; font-weight: 800; }
    .pill-inactive { background-color: #1a202c; color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.1); }
    .nav-active { color: #f59e0b; }
    .nav-inactive { color: #94a3b8; }
  </style>
</head>
<body class="min-h-screen pb-24 antialiased selection:bg-amber-500 selection:text-black">

  <!-- Header with TECH TV MOVIES Branding -->
  <header class="bg-slate-950/90 border-b border-white/10 px-4 py-3 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-xl mx-auto flex items-center gap-3">
      <!-- Logo -->
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-black font-black shadow-lg shadow-amber-500/20">
          <i data-lucide="film" class="w-5 h-5 text-black"></i>
        </div>
        <h1 class="font-black text-lg tracking-wider text-white flex items-center">
          TECH TV <span class="text-amber-500 ml-1">MOVIES</span>
        </h1>
      </div>

      <!-- Top Search Bar -->
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-amber-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          id="topSearchInput" 
          onkeyup="handleLiveSearch()"
          placeholder="Search movies..." 
          class="w-full bg-slate-900/90 border border-amber-500/30 rounded-xl py-2 pl-9 pr-3 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-amber-500 transition"
        />
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="max-w-xl mx-auto px-4 pt-5">

    <!-- Title & Filter Bar -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-black text-white tracking-wide">Browse</h2>
      <button onclick="toggleFilterModal()" class="px-3 py-1.5 rounded-xl border border-white/20 bg-slate-900 text-xs font-bold text-slate-300 flex items-center gap-1.5 hover:text-white">
        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 text-amber-500"></i> Filters
      </button>
    </div>

    <!-- Category Pill Tabs -->
    <div class="flex gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar">
      <button id="pillAll" onclick="selectCategory('All')" class="pill-active px-5 py-2 rounded-full text-xs shrink-0 transition">All</button>
      <button id="pillMovies" onclick="selectCategory('Movies')" class="pill-inactive px-5 py-2 rounded-full text-xs shrink-0 transition">Movies</button>
      <button id="pillTV" onclick="selectCategory('TV Series')" class="pill-inactive px-5 py-2 rounded-full text-xs shrink-0 transition">TV Series</button>
      <button id="pillAnime" onclick="selectCategory('Anime')" class="pill-inactive px-5 py-2 rounded-full text-xs shrink-0 transition">Anime</button>
    </div>

    <!-- Embedded Video Stream Modal Player -->
    <div id="moviePlayerSection" class="hidden card-dark rounded-3xl p-4 mb-6 border border-amber-500/40 shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-bold text-amber-500 flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span> TECH TV MOVIES PLAYER
        </span>
        <button onclick="closeMoviePlayer()" class="text-slate-400 hover:text-white text-xs font-bold bg-slate-800 px-3 py-1 rounded-full">✕ Close</button>
      </div>

      <div class="aspect-video w-full rounded-2xl overflow-hidden bg-black mb-3 border border-white/10 shadow-2xl">
        <iframe id="movieIframe" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>

      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 id="playerMovieTitle" class="font-bold text-base text-white">Movie Title</h3>
          <p id="playerMovieMeta" class="text-xs text-slate-400">Year • Rating</p>
        </div>
        <button id="playerDownloadBtn" class="btn-amber px-4 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 shadow">
          <i data-lucide="download" class="w-4 h-4"></i> Download MP4
        </button>
      </div>
    </div>

    <!-- Movie Cards Grid -->
    <div id="moviesGrid" class="grid grid-cols-2 gap-4"></div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-950/95 border-t border-white/10 py-2.5 px-6 z-50 backdrop-blur-xl">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      
      <button onclick="navClick('home')" id="navHome" class="flex flex-col items-center gap-1 nav-inactive transition">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Home</span>
      </button>

      <button onclick="navClick('search')" id="navSearch" class="flex flex-col items-center gap-1 nav-inactive transition">
        <i data-lucide="search" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Search</span>
      </button>

      <button onclick="navClick('browse')" id="navBrowse" class="flex flex-col items-center gap-1 nav-active transition">
        <div class="p-1 rounded-xl bg-amber-500/20 text-amber-500">
          <i data-lucide="tv" class="w-5 h-5"></i>
        </div>
        <span class="text-[10px] font-bold">Browse</span>
      </button>

      <button onclick="navClick('watchlist')" id="navWatchlist" class="flex flex-col items-center gap-1 nav-inactive transition">
        <i data-lucide="bookmark" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Watchlist</span>
      </button>

      <button onclick="navClick('about')" id="navAbout" class="flex flex-col items-center gap-1 nav-inactive transition">
        <i data-lucide="info" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">About</span>
      </button>

    </div>
  </nav>

  <script>
    lucide.createIcons();
    let currentCategory = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      fetchMovies('');
    });

    function selectCategory(cat) {
      currentCategory = cat;
      ['All', 'Movies', 'TV Series', 'Anime'].forEach(c => {
        const btn = document.getElementById(`pill${c.replace(' ', '')}`);
        if (btn) {
          btn.className = (c === cat) ? 'pill-active px-5 py-2 rounded-full text-xs shrink-0 transition' : 'pill-inactive px-5 py-2 rounded-full text-xs shrink-0 transition';
        }
      });
      fetchMovies(document.getElementById('topSearchInput').value);
    }

    let searchTimer = null;
    function handleLiveSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const q = document.getElementById('topSearchInput').value;
        fetchMovies(q);
      }, 300);
    }

    async function fetchMovies(query) {
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '<div class="col-span-2 text-center py-12 text-slate-400 text-xs"><div class="w-6 h-6 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>Loading movies...</div>';

      try {
        const res = await fetch(`/api/movies/search?q=${encodeURIComponent(query)}&category=${encodeURIComponent(currentCategory)}`);
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0) {
          renderMovieCards(data);
        } else {
          grid.innerHTML = '<div class="col-span-2 text-center py-12 text-slate-400 text-xs">No movies found matching your search.</div>';
        }
      } catch (e) {
        grid.innerHTML = '<div class="col-span-2 text-center py-12 text-slate-400 text-xs">Error loading catalog.</div>';
      }
    }

    function renderMovieCards(items) {
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = items.map(m => `
        <div class="card-dark rounded-2xl overflow-hidden flex flex-col group cursor-pointer border border-white/5 hover:border-amber-500/40 transition">
          
          <div onclick="openMovieStream('${m.embedUrl}', '${m.title.replace(/'/g, "")}', '${m.year}')" class="relative aspect-[2/3] w-full bg-slate-900 overflow-hidden">
            <img src="${m.poster}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="poster" />
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-black/30"></div>

            <div class="absolute top-2.5 left-2.5 bg-blue-600/80 backdrop-blur-md text-white text-[9px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">
              ${m.type}
            </div>

            <div class="absolute bottom-2.5 left-2.5 right-2.5 flex flex-col gap-1">
              <div class="flex items-center gap-1 text-amber-400 font-extrabold text-xs">
                <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i> ${m.rating} <span class="text-[9px] text-slate-400 font-normal">(${m.votes})</span>
              </div>
              <div class="flex flex-wrap gap-1">
                ${m.genres.map(g => `<span class="bg-black/60 backdrop-blur-sm text-slate-200 text-[9px] px-1.5 py-0.5 rounded">${g}</span>`).join('')}
              </div>
            </div>
          </div>

          <div class="p-3 flex flex-col justify-between flex-1">
            <div>
              <h3 onclick="openMovieStream('${m.embedUrl}', '${m.title.replace(/'/g, "")}', '${m.year}')" class="font-bold text-sm text-white line-clamp-1 group-hover:text-amber-400 transition mb-1">${m.title}</h3>
              <div class="flex items-center gap-2 text-[10px] text-slate-400">
                <span>${m.year}</span>
                <span>•</span>
                <span>${m.duration}</span>
                <span>${m.country}</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-1.5 mt-3">
              <button onclick="openMovieStream('${m.embedUrl}', '${m.title.replace(/'/g, "")}', '${m.year}')" class="btn-amber py-1.5 rounded-lg text-[10px] font-black flex items-center justify-center gap-1">
                <i data-lucide="play" class="w-3 h-3 fill-current"></i> Stream
              </button>
              <button onclick="downloadMovieFile('${m.id}', '${m.title.replace(/'/g, "")}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 rounded-lg text-[10px] font-bold flex items-center justify-center gap-1 border border-white/10">
                <i data-lucide="download" class="w-3 h-3"></i> MP4
              </button>
            </div>
          </div>

        </div>
      `).join('');
      lucide.createIcons();
    }

    function openMovieStream(embedUrl, title, year) {
      document.getElementById('movieIframe').src = embedUrl;
      document.getElementById('playerMovieTitle').innerText = title;
      document.getElementById('playerMovieMeta').innerText = `${year} • Stream HD`;
      document.getElementById('playerDownloadBtn').onclick = () => downloadMovieFile('movie', title);
      document.getElementById('moviePlayerSection').classList.remove('hidden');
      document.getElementById('moviePlayerSection').scrollIntoView({ behavior: 'smooth' });
    }

    function closeMoviePlayer() {
      document.getElementById('movieIframe').src = '';
      document.getElementById('moviePlayerSection').classList.add('hidden');
    }

    function downloadMovieFile(id, title) {
      window.location.href = `/api/movies/download?id=${id}&title=${encodeURIComponent(title)}`;
    }

    function navClick(target) {
      ['home', 'search', 'browse', 'watchlist', 'about'].forEach(n => {
        const btn = document.getElementById(`nav${n.charAt(0).toUpperCase() + n.slice(1)}`);
        if (btn) btn.className = (n === target) ? 'flex flex-col items-center gap-1 nav-active transition' : 'flex flex-col items-center gap-1 nav-inactive transition';
      });
      if (target === 'search') document.getElementById('topSearchInput').focus();
    }

    function toggleFilterModal() {
      alert("Tech TV Movies Filters: Action, Thriller, Drama, Anime, Romance.");
    }
  </script>
</body>
</html>
